[package]
name = "fsearch"
version = "0.2.2"
edition = "2024"
license = "MIT"

[features]
default = []
# Local embeddings. Off by default so a normal build does not link SQLite or
# talk to an embeddings server. The daemon also stays idle until semantic.json
# sets "enabled", or a semantic request arrives.
semantic = ["dep:rusqlite"]

[dependencies]
libc = "0.2"
rayon = "1.12"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.36", features = ["bundled"], optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Release plus symbols, for profilers: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = 1
strip = false
